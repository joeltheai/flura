<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>flura</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='black' stroke='white'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app-shell">
  <div class="transport" role="group" aria-label="Playback controls">
    <button id="play" type="button" aria-label="Play" aria-pressed="false" title="Play / stop (Space)"><svg viewBox="0 0 24 24" aria-hidden="true"><path id="play-icon" d="m9 5 11 7-11 7Z"/></svg></button>
    <label class="tempo-control" for="tempo"><input id="tempo" type="number" min="40" max="240" value="122" inputmode="numeric" aria-label="Tempo in beats per minute" /><span>bpm</span></label>
    <canvas id="scope" width="112" height="64" aria-hidden="true"></canvas>
    <div class="volume-control"><button type="button" id="mute" aria-label="Mute" aria-pressed="false" title="Mute"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m9 4-4 4H2v4h3l4 4ZM12 6a6 6 0 0 1 0 8M14.5 3.5a10 10 0 0 1 0 13"/></svg></button><input id="volume" type="range" min="0" max="100" value="55" aria-label="Volume" /></div>
  </div>
  <main class="carousel" aria-label="Instrument carousel" tabindex="0">
    <section class="view chord-view" aria-label="Chords" data-page="0">
      <div class="instrument">
        <div class="wheel-wrap"><svg id="wheel" viewBox="0 0 340 340" aria-label="Circle of fifths chord wheel"></svg><button type="button" id="audition" class="chord-center" aria-label="Audition selected chord" title="Audition chord"><span id="chord-name">C</span><span id="chord-quality">add9</span></button></div>
        <div class="chord-options">
          <select id="extension" aria-label="Chord extension" title="Chord extension"><option value="triad">triad</option><option value="seventh">7th</option><option value="ninth" selected>add9</option><option value="sus">sus4</option></select>
          <select id="voicing" aria-label="Chord inversion" title="Chord inversion"><option value="0">root</option><option value="1">inv 1</option><option value="2">inv 2</option></select>
        </div>
        <div class="progression-section" role="group" aria-label="Four-chord progression">
          <button id="capture" type="button" aria-label="Capture four chords" aria-pressed="false" title="Capture four chords"><i class="record-dot"></i></button>
          <div class="progression-slots"><button type="button" data-slot="0" aria-label="Progression slot 1, empty"><strong>·</strong></button><button type="button" data-slot="1" aria-label="Progression slot 2, empty"><strong>·</strong></button><button type="button" data-slot="2" aria-label="Progression slot 3, empty"><strong>·</strong></button><button type="button" data-slot="3" aria-label="Progression slot 4, empty"><strong>·</strong></button></div>
          <button id="clear-progression" type="button" aria-label="Clear chord progression" title="Clear chord progression" hidden>×</button>
        </div>
      </div>
    </section>
    <section class="view arp-view" aria-label="Arpeggiator" data-page="1" inert>
      <div class="instrument">
        <div class="arp-topline"><select id="pattern" aria-label="Arpeggiator pattern" title="Pattern"><option value="bloom">up / down</option><option value="up">up</option><option value="down">down</option><option value="drift">5 / 8</option><option value="custom">custom</option></select><select id="rate" aria-label="Arpeggiator rate" title="Rate"><option value="1">1/4</option><option value="0.5">1/8</option><option value="0.25" selected>1/16</option><option value="0.3333333333333333">1/8T</option></select><button id="randomize-lane" type="button" class="icon-button" aria-label="Randomize current lane" title="Randomize current lane"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m14 3 3 3-3 3M3 6h14M6 11l-3 3 3 3m-3-3h14"/></svg></button><button class="icon-button" id="arp-bypass" type="button" aria-label="Bypass arpeggiator" aria-pressed="false" title="Bypass arpeggiator"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2v7M5.5 4.5a7 7 0 1 0 9 0"/></svg></button></div>
        <div class="lane-tabs" role="tablist" aria-label="Arpeggiator lanes"><button type="button" id="tab-note" role="tab" aria-selected="true" aria-controls="lane-panel" data-lane="note">note</button><button type="button" id="tab-gate" role="tab" aria-selected="false" aria-controls="lane-panel" tabindex="-1" data-lane="gate">gate</button><button type="button" id="tab-velocity" role="tab" aria-selected="false" aria-controls="lane-panel" tabindex="-1" data-lane="velocity">vel</button><button type="button" id="tab-octave" role="tab" aria-selected="false" aria-controls="lane-panel" tabindex="-1" data-lane="octave">oct</button></div>
        <div id="lane-panel" role="tabpanel" aria-labelledby="tab-note"><div id="step-graph" class="step-graph" aria-label="Draw steps by dragging vertically"></div><div id="step-mutes" class="step-mutes" aria-label="Step on and off"></div></div>
        <div class="arp-settings"><div class="range-control"><label for="lane-length">len</label><output for="lane-length" id="length-out">8</output><input id="lane-length" aria-label="Current lane length" type="range" min="1" max="16" value="8" /></div><select id="lane-division" aria-label="Current lane clock division" title="Clock division"><option value="1">÷1</option><option value="2">÷2</option><option value="3">÷3</option><option value="4">÷4</option><option value="6">÷6</option><option value="8">÷8</option></select><div class="range-control"><label for="swing">swing</label><output for="swing" id="swing-out">0%</output><input id="swing" type="range" min="0" max="60" value="0" /></div><button type="button" id="link-lengths" class="icon-button" aria-label="Link lane lengths" aria-pressed="true" title="Link lane lengths">⇄</button><button type="button" id="retrigger" aria-label="Enable retrigger on chord change" aria-pressed="false" title="Restart the pattern when the chord changes">retrigger</button></div>
      </div>
    </section>
    <section class="view flower-view" aria-label="Flower" data-page="2" inert>
      <div class="instrument">
        <div class="stage"><canvas id="flower-canvas" aria-label="Floating 3D flower" tabindex="-1"></canvas><div class="view-tools"><button id="motion" class="icon-button" type="button" aria-label="Pause floating motion" aria-pressed="true" title="Pause floating motion"><svg id="motion-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M7 5v10M13 5v10"/></svg></button><button id="rotate-flower" class="icon-button" type="button" aria-label="Rotate flower" title="Rotate flower" aria-pressed="false"><svg viewBox="0 0 20 20" aria-hidden="true"><ellipse cx="10" cy="10" rx="8" ry="3.5"/><path d="m14 5 3 3-4 1"/></svg></button><button id="reset-view" class="icon-button" type="button" aria-label="Reset camera view" title="Reset camera view"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 8a6 6 0 1 1 0 5M4 3v5h5"/></svg></button></div><p id="scene-error" role="alert" hidden></p></div>
        <div class="waves" role="group" aria-label="Oscillator waveform">
          <button type="button" data-wave="sawtooth" aria-label="Sawtooth" aria-pressed="true" title="Sawtooth"><svg viewBox="0 0 30 16" aria-hidden="true"><path d="M2 13 10 3v10L18 3v10l8-10"/></svg></button>
          <button type="button" data-wave="sine" aria-label="Sine" aria-pressed="false" title="Sine"><svg viewBox="0 0 30 16" aria-hidden="true"><path d="M2 8Q8-3 14 8T26 8"/></svg></button>
          <button type="button" data-wave="triangle" aria-label="Triangle" aria-pressed="false" title="Triangle"><svg viewBox="0 0 30 16" aria-hidden="true"><path d="m2 13 6-10 6 10 6-10 6 10"/></svg></button>
          <button type="button" data-wave="square" aria-label="Square" aria-pressed="false" title="Square"><svg viewBox="0 0 30 16" aria-hidden="true"><path d="M2 13V3h8v10h8V3h8"/></svg></button>
        </div>
        <div id="synth-controls" class="synth-controls"></div>
        <div class="flower-actions"><button type="button" id="randomize" class="icon-button" aria-label="Randomize synth" title="Randomize synth"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m14 3 3 3-3 3M3 6h14M6 11l-3 3 3 3m-3-3h14"/></svg></button><button type="button" id="reset" class="icon-button" aria-label="Reset synth" title="Reset synth"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 8a6 6 0 1 1 0 5M4 3v5h5"/></svg></button></div>
      </div>
    </section>
    <section class="view envelope-view" aria-label="ADSR envelope" data-page="3" inert>
      <div class="instrument">
        <svg id="envelope" viewBox="0 0 360 210" aria-label="ADSR envelope. Drag the attack, decay, sustain, and release points.">
          <g class="env-grid" aria-hidden="true"><path d="M20 28H340M20 64H340M20 100H340M20 136H340M20 172H340M20 28V172M100 28V172M180 28V172M260 28V172M340 28V172"/></g>
          <path id="env-area" aria-hidden="true" />
          <g id="env-guides" aria-hidden="true"></g>
          <path id="env-line" aria-hidden="true" />
          <path id="env-playhead" aria-hidden="true" hidden />
          <circle id="env-activity" r="3" aria-hidden="true" hidden />
          <g id="env-handles"></g>
          <g id="env-labels" aria-hidden="true"></g>
        </svg>
        <div id="envelope-controls" class="envelope-controls"></div>
        <div class="envelope-actions"><button type="button" id="audition-envelope" class="icon-button" aria-label="Audition envelope" title="Audition envelope"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 10 7-10 7Z"/></svg></button><button type="button" id="reset-envelope" class="icon-button" aria-label="Reset ADSR envelope" title="Reset ADSR envelope"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 8a6 6 0 1 1 0 5M4 3v5h5"/></svg></button></div>
      </div>
    </section>
  </main>
  <nav class="carousel-wayfinding" aria-label="Instrument views"><button type="button" id="previous-view" aria-label="Previous view" disabled>←</button><div class="view-tabs carousel-dots"><button type="button" data-view="0" aria-label="Chords view" aria-current="page"></button><button type="button" data-view="1" aria-label="Arp view"></button><button type="button" data-view="2" aria-label="Flower view"></button><button type="button" data-view="3" aria-label="ADSR view"></button></div><button type="button" id="next-view" aria-label="Next view">→</button></nav>
  <div id="announcement" class="sr-only" aria-live="polite"></div>
  <p id="audio-error" role="alert" hidden></p>
</div>
<script src="vendor/three.min.js"></script>
<script src="music.js"></script>
<script src="audio.js"></script>
<script src="flower.js"></script>
<script src="synth.js"></script>
<script src="app.js"></script>
</body>
</html>
